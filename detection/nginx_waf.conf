# ==============================================================================
# NGINX WAF VIRTUAL PATCHING & DETECTION LOGGING - CVE-2026-111497
# ==============================================================================

log_format node2shell_sec '$remote_addr - [$time_local] "$request" '
                          'status=$status br_enc="$http_content_encoding" '
                          'expect="$http_expect" body_bytes=$request_length '
                          'ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/node2shell_security.log node2shell_sec;

    # Gioi han kich thuoc body toi da 1MB (Chan luong Probe ~23MB cua Assetnote scanner)
    client_max_body_size 1m;

    # Chot chan 1: Tu choi tat ca HTTP Request su dung Content-Encoding: br
    if ($http_content_encoding ~* "\bbr\b") {
        return 415 '{"error": "Unsupported Media Type", "reason": "Brotli Content-Encoding blocked by WAF (CVE-2026-111497)"}';
    }

    location / {
        proxy_pass http://app-vulnerable:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Xoa header Accept-Encoding: br de ngan Backend tu nen/giai nen
        proxy_set_header Accept-Encoding "gzip, deflate";
    }
}
